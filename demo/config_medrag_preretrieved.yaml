#################
# MedScore Configuration File
#################

# --- Main Input/Output Files ---
# These paths are relative to where you run the script.
input_file: "../data/AskDocs.demo.jsonl"
output_dir: "../results/medrag_pre"
response_key: "response"
question_key: "question"  # JSON key holding the user question (only read when qa_mode is true)
qa_mode: false            # AskDocs has a long question and a self-contained response. See README "QA mode".

# --- Decomposition Configuration ---
decomposer:
  type: "medscore"  # Options: medscore, factscore, dndscore, custom
  model_name: "gpt-4o-mini"
  server_path: "https://api.openai.com/v1"

# --- Verification Configuration ---
verifier:
  type: "provided"
  provided_evidence_path: "../data/askdocsai_evidence.json"
  model_name: "gpt-4o"
  server_path: "https://api.openai.com/v1"  #set the server_path to your GPU server when using HuggingFace models via vLLM server_path
